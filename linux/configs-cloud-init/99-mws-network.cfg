# =======================================================================
# FILE: 99-mws-network.cfg
# =======================================================================
# Network settings applied by cloud-init on first boot in MWS.
#
# We do NOT define interface names or addresses here. MWS provides
# network configuration via metadata (config-drive), and cloud-init
# applies it. If metadata is absent, cloud-init falls back to DHCP on
# the first suitable interface.
#
# See 99-mws-datasource.cfg for details on how metadata is delivered.
#
# Deploy to: /etc/cloud/cloud.cfg.d/99-mws-network.cfg
# =======================================================================

# Enable cloud-init to apply network config from metadata.
network:
  config: enabled
  version: 2

# Preserve /etc/resolv.conf — MWS sets DNS via DHCP or metadata.
manage_resolv_conf: false