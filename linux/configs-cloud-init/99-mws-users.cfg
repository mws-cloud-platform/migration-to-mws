# =======================================================================
# FILE: 99-mws-users.cfg
# =======================================================================
# User account settings applied by cloud-init on first boot in MWS.
#
# User credentials, SSH keys, and passwords come from MWS metadata
# (when provisioning new VMs). For migrated VMs, the existing user
# and settings are preserved unless metadata overrides them.
#
# See 99-mws-datasource.cfg for details on how metadata is delivered.
#
# Deploy to: /etc/cloud/cloud.cfg.d/99-mws-users.cfg
# =======================================================================

# Do not create the default 'ubuntu' or 'cloud-user' user.
# MWS provides its own user via metadata, or expects the existing
# user from the source VM to be preserved.
users: []

# Do not expire the root password.
chpasswd:
  expire: false

# Preserve the existing user's SSH authorized_keys and password
# unless metadata overrides them.
ssh_pwauth: true

# Preserve hostname from metadata if provided.
preserve_hostname: false

# Do not reset /etc/hosts on first boot.
manage_etc_hosts: false