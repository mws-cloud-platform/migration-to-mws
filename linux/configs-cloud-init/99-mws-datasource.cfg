# =======================================================================
# FILE: 99-mws-datasource.cfg
# =======================================================================
# Datasource priorities for cloud-init on MWS Cloud Platform.
#
# --- What this file does NOT do ---------------------------------------
#
# The toolkit does NOT set passwords, hostname, DNS servers, network
# addresses, or SSH keys explicitly. All of these values are provided
# by MWS Cloud Platform through metadata.
#
# These config files only ENABLE cloud-init to:
#   1. Find the metadata (datasource discovery)
#   2. Accept the data from metadata
#   3. Apply it on first boot
#
# If metadata is missing or the datasource is not reachable, cloud-init
# does nothing and the VM keeps its existing settings.
#
# --- How MWS delivers metadata ----------------------------------------
#
# MWS attaches a config-drive disk (NoCloud/ConfigDrive format) to the
# VM. Cloud-init reads it and applies:
#
#   - hostname         from metadata (user-data / meta-data)
#   - network config   from network-config on config-drive
#   - user account     from metadata (if provisioning new VM)
#   - SSH public keys  from metadata
#   - user-data script from metadata
#
# For an existing migrated VM, most of these are already set in the
# image. Metadata overrides what needs to be overridden (typically
# network settings after the move from VMware to KVM).
#
# Deploy to: /etc/cloud/cloud.cfg.d/99-mws-datasource.cfg
# =======================================================================

datasource_list: [ ConfigDrive, NoCloud, None ]

datasource:
  ConfigDrive:
    dsmode: local
  NoCloud:
    dsmode: local