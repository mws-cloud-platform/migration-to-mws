# =====================================================================
# FILE: cloudbase-init-unattend.conf
# =====================================================================
# CloudBase-Init configuration used during Sysprep unattend phase.
# Deploy to: C:\Program Files\Cloudbase Solutions\Cloudbase-Init\conf\
#
# This is a MINIMAL config. On the very first boot after Sysprep,
# only the essential plugins run: hostname, password, local scripts.
# Heavy plugins (ExtendVolumes, NTPClient, NetworkConfig) are skipped
# to avoid interfering with OOBE initialization.
# =====================================================================

[DEFAULT]

# --- User account ----------------------------------------------------
# MUST match the username used in cloudbase-init.conf
# and in the MWS control panel.
username=Admin
groups=Administrators

# --- Password injection ----------------------------------------------
# Enable password injection during OOBE.
inject_user_password=true

# --- First logon behaviour -------------------------------------------
# Do NOT force password change at first logon.
first_logon_behaviour=no

# --- Config drive detection ------------------------------------------
# Same detection logic as the main config.
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true

# --- Paths (do not change) -------------------------------------------
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\

# --- Logging ---------------------------------------------------------
# Separate log file to distinguish from runtime log.
verbose=true
debug=false
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init-unattend.log
logging_serial_port_settings=
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN

# --- Networking ------------------------------------------------------
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true

# --- Metadata service priority ---------------------------------------
# During OOBE, only ConfigDrive is checked. It is fast and reliable.
# HTTP/EC2 fallbacks are unnecessary in the OOBE phase.
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,
  cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService

# --- Plugins ---------------------------------------------------------
# Minimal plugin set for OOBE:
#   SetHostNamePlugin     - sets VM hostname from metadata
#   SetUserPasswordPlugin - injects Administrator password from metadata
#   LocalScriptsPlugin    - runs any custom first-boot scripts (if present)
# Everything else runs later, when the main cloudbase-init service starts.
plugins=cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,
  cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,
  cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin

# --- Service lifecycle -----------------------------------------------
allow_reboot=false
stop_service_on_exit=false