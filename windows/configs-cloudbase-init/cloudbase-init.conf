# =====================================================================
# FILE: cloudbase-init.conf
# =====================================================================
# CloudBase-Init main configuration for MWS Cloud Platform.
# Deploy to: C:\Program Files\Cloudbase Solutions\Cloudbase-Init\conf\
# =====================================================================

[DEFAULT]

# --- User account ----------------------------------------------------
# IMPORTANT: this username MUST match what you specify in the MWS
# control panel when creating the VM from this image.
# "Admin" is the MWS default. If your wizard uses a different name,
# change it here to match exactly (case-sensitive on Windows).
username=Admin
groups=Administrators

# --- Password injection from metadata --------------------------------
# true  = set password from MWS metadata (recommended)
# false = keep current password
inject_user_password=true

# --- First logon behaviour -------------------------------------------
# no  = do NOT force password change on first logon
# yes = force user to change password at first logon
# We want 'no' so the password from MWS takes effect immediately.
first_logon_behaviour=no

# --- Config drive detection ------------------------------------------
# MWS attaches a config-drive disk with metadata.
# All three detection methods are enabled for robustness.
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true

# --- Paths (do not change) -------------------------------------------
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\

# --- Logging ---------------------------------------------------------
verbose=true
debug=false
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init.log
logging_serial_port_settings=
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN

# --- Networking ------------------------------------------------------
# Let CloudBase-Init use DHCP to get MTU and NTP settings.
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true

# --- Metadata service priority ---------------------------------------
# Order matters: first service that responds wins.
# ConfigDrive is preferred because MWS uses a config-drive disk.
# HTTP and EC2 are fallbacks.
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,
  cloudbaseinit.metadata.services.httpservice.HttpService,
  cloudbaseinit.metadata.services.ec2service.EC2Service,
  cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService

# --- Plugins ---------------------------------------------------------
# SetUserPasswordPlugin is REQUIRED for password injection from MWS.
# SetHostNamePlugin sets the hostname from metadata.
# ExtendVolumesPlugin expands C: to the full disk size if needed.
# NetworkConfigPlugin configures network from metadata (if present).
# MTUPlugin adjusts MTU for the VirtIO NIC.
# NTPClientPlugin syncs time.
# LocalScriptsPlugin runs scripts from LocalScripts folder.
# UserDataPlugin runs user-data scripts from metadata.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,
  cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,
  cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,
  cloudbaseinit.plugins.common.networkconfig.NetworkConfigPlugin,
  cloudbaseinit.plugins.windows.ntpclient.NTPClientPlugin,
  cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,
  cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin,
  cloudbaseinit.plugins.common.userdata.UserDataPlugin

# --- Service lifecycle -----------------------------------------------
# Do NOT let CloudBase-Init reboot the VM on its own.
# We keep control over reboots in our migration pipeline.
allow_reboot=false
stop_service_on_exit=false